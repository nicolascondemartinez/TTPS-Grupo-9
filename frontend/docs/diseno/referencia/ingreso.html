<div style="min-height: 760px; box-sizing: border-box; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #F5F1FF; background-color: #130C28; background-image: radial-gradient(circle at 18% 12%, rgba(139,92,246,0.5), rgba(139,92,246,0) 50%), radial-gradient(circle at 70% 95%, rgba(255,138,61,0.34), rgba(255,138,61,0) 46%), linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px); background-size: auto, auto, 32px 32px, 32px 32px">

      </div>
      <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.01em">Exoma Clínico</div>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 32px">
      <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px; max-width: 520px">
        <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #FF8A3D">Acceso al sistema</div>
        <h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; font-size: 52px; line-height: 56px; letter-spacing: -0.02em">Estudios de <span style="background: linear-gradient(90deg, #A78BFA 0%, #FF8A3D 100%); -webkit-background-clip: text; background-clip: text; color: transparent">exoma clínico</span>, de punta a punta.</h1>
        <p style="margin: 0; font-size: 17px; line-height: 27px; color: #BDB3DD">Ingresá con tu cuenta para ver y gestionar tus estudios.</p>
      </div>
      <div style="flex: 0 0 auto; display: flex; justify-content: center; margin: 0 auto">
        <svg width="132" height="352" viewBox="0 0 120 400" fill="none" aria-hidden="true" style="filter: drop-shadow(0 0 16px rgba(139,92,246,0.5))">

    <div style="font-size: 13px; color: #BDB3DD">Laboratorio de genética clínica</div>

  <div style="flex: 1 1 440px; min-width: 0; box-sizing: border-box; padding: 40px 32px; display: flex; align-items: center; justify-content: center">

        <div style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; font-size: 28px; line-height: 34px">Ingresar</h2>
          <div style="font-size: 14px; line-height: 22px; color: #5B5373">Si es tu primer ingreso, vas a tener que cambiar la contraseña.</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="mail" style="font-size: 14px; font-weight: 500">Correo electrónico</label>
          <input id="mail" type="email" placeholder="nombre@dominio.com" style="height: 48px; box-sizing: border-box; width: 100%; border: 1px solid #8A81A8; border-radius: 12px; padding: 0 14px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; color: #160F2E; background: #FFFFFF">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="clave" style="font-size: 14px; font-weight: 500">Contraseña</label>
          <input id="clave" type="password" style="height: 48px; box-sizing: border-box; width: 100%; border: 1px solid #8A81A8; border-radius: 12px; padding: 0 14px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 16px; color: #160F2E; background: #FFFFFF">
        </div>
        <button type="button" style="height: 50px; border: 0; border-radius: 12px; background: linear-gradient(90deg, #6D28D9 0%, #C2410C 100%); color: #FFFFFF; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; font-size: 17px; cursor: pointer; box-shadow: 0 8px 22px rgba(109, 40, 217, 0.3)">Ingresar</button>
        <a href="#" style="font-size: 14px; text-align: center; text-underline-offset: 4px">¿Olvidaste tu contraseña?</a>
