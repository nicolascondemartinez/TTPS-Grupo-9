[project]
name = "ttps-backend"
version = "0.1.0"
description = "API del core del Sistema de Exoma Clínico (TTPS)"
requires-python = ">=3.11,<4.0"
dependencies = [
    "flask>=3.0",
    "flask-cors>=5.0",
    "python-dotenv>=1.0",
    "gunicorn>=23.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg2-binary>=2.9",
    "argon2-cffi>=23.1",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
